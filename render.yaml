# Render Blueprint: creates the web app and a PostgreSQL database for it.
# In the Render dashboard choose New > Blueprint and pick this repository.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: task-master
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Gunicorn listens on the port Render provides in $PORT. The app
    # brings the database up to date when it starts.
    startCommand: gunicorn "app:create_app()"
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: task-master-db
          property: connectionString
      # A long random key, generated once by Render and kept secret.
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Render's proxy handles HTTPS in front of the app.
      - key: FLASK_BEHIND_PROXY
        value: "true"
      # Only send the login cookies over HTTPS.
      - key: FLASK_SESSION_COOKIE_SECURE
        value: "true"
      - key: FLASK_REMEMBER_COOKIE_SECURE
        value: "true"

databases:
  - name: task-master-db
    plan: free
