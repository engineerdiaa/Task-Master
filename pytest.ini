[pytest]
testpaths = tests
# Let the tests import app.py, models.py, etc. from the project folder.
pythonpath = .
# Treat warnings (such as deprecations) as test failures, except one that
# comes from inside Flask-Login 0.6.3 itself on Python 3.12+.
filterwarnings =
    error
    ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login
