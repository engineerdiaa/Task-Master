name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13']
        include:
          # The app is developed on Windows, so test there too.
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  postgres:
    # The same database a hosting service like Render provides.
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskmaster
        run: python -m pytest tests/test_postgres.py
