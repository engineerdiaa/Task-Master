{%extends 'base.html'%}

{%block head%}
<title>Edit task - Task Master</title>
{%endblock%}

{%block body%}
<h1>Edit task</h1>
<section class="card narrow">
    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form class="stacked-form" action="{{ url_for('tasks.update', task_id=task.id, **view) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% include '_task_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="button button-primary">Save changes</button>
            <a href="{{ url_for('tasks.index', **view) }}" class="cancel">Cancel</a>
        </div>
    </form>
</section>
{%endblock%}
