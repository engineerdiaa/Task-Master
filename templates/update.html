{%extends 'base.html'%}

{%block head%}
<title>Task Master</title>
{%endblock%}

{%block body%}
<div class="content">
    <h1>Update Task</h1>

<br>
    <div class="form1">
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <form action="/update/{{task.id}}" method="POST">
            <input type="text" name="content" id="content"
                   value="{{ content }}"
                   required maxlength="{{ TASK_MAX_LENGTH }}">
            <input type="submit" value="Update">
        </form>
    </div>
</div>
{%endblock%}
