{%extends 'base.html'%}

{%block head%}
<title>Task Master</title>
{%endblock%}

{%block body%}
<div class="content">
    <h1>Update Task</h1>

<br>
    <div class="form1">
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <form action="{{ url_for('tasks.update', task_id=task.id) }}" method="POST">
            {% include '_task_fields.html' %}
            <input type="submit" value="Update">
        </form>
    </div>
</div>
{%endblock%}
